<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Marker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl font-bold text-xl shadow-md shadow-indigo-200">
                    📋
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Attendance Marker</h1>
                    <p class="text-xs text-slate-500 font-medium">Fast & Easy Daily Tracking</p>
                </div>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div class="text-right hidden sm:block">
                    <p id="current-date" class="text-xs font-semibold text-slate-600"></p>
                    <p class="text-[10px] text-slate-400">Session Active</p>
                </div>
                <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-4 py-2.5 rounded-lg shadow-sm transition flex items-center gap-1.5 cursor-pointer">
                    📥 Export CSV
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6 flex flex-col gap-6">

        <!-- Stats Bar -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-col">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Students</span>
                <span id="stat-total" class="text-2xl font-bold text-slate-900 mt-1">0</span>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-col">
                <span class="text-xs font-semibold text-emerald-500 uppercase tracking-wider">Present</span>
                <span id="stat-present" class="text-2xl font-bold text-emerald-600 mt-1">0</span>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-col">
                <span class="text-xs font-semibold text-rose-500 uppercase tracking-wider">Absent</span>
                <span id="stat-absent" class="text-2xl font-bold text-rose-600 mt-1">0</span>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-col">
                <span class="text-xs font-semibold text-indigo-500 uppercase tracking-wider">Attendance Rate</span>
                <span id="stat-rate" class="text-2xl font-bold text-indigo-600 mt-1">0%</span>
            </div>
        </div>

        <!-- Controls & Add Student Bar -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-col md:flex-row gap-4 justify-between items-center">
            <!-- Add Student Form -->
            <form id="add-form" onsubmit="addStudent(event)" class="flex flex-col sm:flex-row gap-2 w-full md:w-auto flex-grow">
                <input type="text" id="student-name" placeholder="Student Name" required
                    class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none flex-grow">
                <input type="text" id="student-roll" placeholder="Roll No / ID" required
                    class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none sm:w-36">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-5 py-2.5 rounded-lg shadow-sm transition cursor-pointer">
                    Add Student
                </button>
            </form>

            <!-- Quick Action Buttons -->
            <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                <button onclick="markAll(true)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-2 rounded-lg transition cursor-pointer">
                    All Present
                </button>
                <button onclick="markAll(false)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-2 rounded-lg transition cursor-pointer">
                    All Absent
                </button>
                <button onclick="resetList()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-medium px-3 py-2 rounded-lg transition cursor-pointer">
                    Reset
                </button>
            </div>
        </div>

        <!-- Student List Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden flex flex-col">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs font-semibold uppercase tracking-wider">
                            <th class="py-3 px-4">Roll No</th>
                            <th class="py-3 px-4">Name</th>
                            <th class="py-3 px-4 text-center">Status</th>
                            <th class="py-3 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Populated via JavaScript -->
                    </tbody>
                </table>
            </div>
            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center p-12 text-center">
                <div class="text-4xl mb-2">📂</div>
                <p class="text-slate-600 font-medium">No students added yet</p>
                <p class="text-xs text-slate-400 mt-1">Add students using the form above to begin taking attendance.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 text-center text-xs text-slate-400 border-t border-slate-200">
        Attendance Marker &bull; Saved locally in your browser
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Initial Dummy Data if storage is empty
        const defaultStudents = [
            { id: "1", roll: "101", name: "Aarav Sharma", status: true },
            { id: "2", roll: "102", name: "Diya Patel", status: true },
            { id: "3", roll: "103", name: "Kabir Mehta", status: false },
            { id: "4", roll: "104", name: "Ananya Gupta", status: true },
            { id: "5", roll: "105", name: "Rohan Verma", status: true }
        ];

        let students = JSON.parse(localStorage.getItem('attendance_students')) || defaultStudents;

        // Set current date string
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { 
            weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' 
        });

        function saveAndRender() {
            localStorage.setItem('attendance_students', JSON.stringify(students));
            renderTable();
            updateStats();
        }

        function renderTable() {
            const tbody = document.getElementById('student-table-body');
            const emptyState = document.getElementById('empty-state');
            tbody.innerHTML = '';

            if (students.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            students.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition";
                
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium text-slate-600">${escapeHtml(student.roll)}</td>
                    <td class="py-3 px-4 font-semibold text-slate-900">${escapeHtml(student.name)}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="toggleStatus(${index})" class="px-3 py-1.5 rounded-full text-xs font-semibold transition cursor-pointer ${
                            student.status 
                            ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' 
                            : 'bg-rose-100 text-rose-700 hover:bg-rose-200'
                        }">
                            ${student.status ? '✓ Present' : '✕ Absent'}
                        </button>
                    </td>
                    <td class="py-3 px-4 text-right">
                        <button onclick="deleteStudent(${index})" class="text-slate-400 hover:text-rose-600 text-xs font-medium px-2 py-1 rounded transition cursor-pointer" title="Remove Student">
                            🗑️
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStats() {
            const total = students.length;
            const present = students.filter(s => s.status).length;
            const absent = total - present;
            const rate = total > 0 ? Math.round((present / total) * 100) : 0;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-present').innerText = present;
            document.getElementById('stat-absent').innerText = absent;
            document.getElementById('stat-rate').innerText = rate + '%';
        }

        function addStudent(event) {
            event.preventDefault();
            const nameInput = document.getElementById('student-name');
            const rollInput = document.getElementById('student-roll');

            students.push({
                id: Date.now().toString(),
                roll: rollInput.value.trim(),
                name: nameInput.value.trim(),
                status: true // Default new students to Present
            });

            nameInput.value = '';
            rollInput.value = '';
            nameInput.focus();

            saveAndRender();
        }

        function toggleStatus(index) {
            students[index].status = !students[index].status;
            saveAndRender();
        }

        function deleteStudent(index) {
            if (confirm(`Remove ${students[index].name} from the list?`)) {
                students.splice(index, 1);
                saveAndRender();
            }
        }

        function markAll(status) {
            students.forEach(s => s.status = status);
            saveAndRender();
        }

        function resetList() {
            if (confirm("Are you sure you want to clear all attendance records and student data?")) {
                students = [];
                saveAndRender();
            }
        }

        function exportData() {
            if (students.length === 0) {
                alert("No data to export!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Roll Number,Student Name,Status,Date\n";
            const dateStr = new Date().toISOString().split('T')[0];

            students.forEach(s => {
                csvContent += `"${s.roll}","${s.name}","${s.status ? 'Present' : 'Absent'}","${dateStr}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `attendance_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Initial render on load
        renderTable();
        updateStats();
    </script>
</body>
</html>
